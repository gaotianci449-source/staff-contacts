<title>员工联系方式</title>
<style>
:root{
  --bg:#EEF1EF; --card:#FFFFFF; --ink:#1B2420; --sub:#5F6B66; --hint:#7A8681; --muted:#9AA5A0;
  --line:#E7ECE9; --border:#D3DAD6; --selbg:#F2F5F3; --green:#1F7A4D; --greenbg:#DDEFE5;
  --red:#B42318; --redbg:#FBE9E7; --disabled:#B9C2BE;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:16px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:24px 16px calc(32px + var(--sb))}

.h1{font-size:30px;font-weight:900;margin:24px 4px 28px;letter-spacing:.5px}
.total{display:flex;align-items:center;width:100%;background:var(--card);border-radius:22px;padding:26px 16px 26px 24px;margin-bottom:12px;text-align:left}
.total .n{font-size:56px;line-height:1;font-weight:900}
.total .k{flex:1;font-size:20px;font-weight:700}
.total .u{font-size:15px;color:var(--sub);margin:16px 8px 0 4px}
.label{font-size:14px;color:var(--sub);margin:20px 4px 8px}
.group{background:var(--card);border-radius:18px;overflow:hidden}
.menu{display:flex;align-items:center;width:100%;min-height:56px;padding:10px 16px 10px 24px;text-align:left}
.menu+.menu{border-top:1px solid var(--line)}
.menu .t{flex:1;font-size:16px}
.menu .s{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.chev{color:var(--muted);flex:none}

.bar{display:flex;align-items:center;padding:12px 20px 4px 4px;min-height:64px}
.bar h2{flex:1;margin:0;font-size:26px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trail{font-size:15px;color:var(--sub)}
.iconbtn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:24px;flex:none}
.selbar{display:flex;align-items:center;padding:12px 4px 4px;min-height:64px}
.selbar h2{flex:1;margin:0;text-align:center;font-size:20px;font-weight:700}
.txtbtn{height:48px;padding:0 16px;font-size:16px}
.txtbtn.green{color:var(--green);font-weight:600}

.searchwrap{padding:8px 16px 0}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 4px 0 16px;background:var(--card);border-radius:16px;color:var(--hint)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--hint)}
.search .clr{width:44px;height:44px;display:none;align-items:center;justify-content:center;color:var(--sub)}
.search.has .clr{display:flex}

.chiprow{display:flex;align-items:center;padding:12px 0 4px}
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:0 8px 0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--border);font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip .c{color:var(--hint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.chip.on .c{color:rgba(255,255,255,.7)}
.chip.dash{background:transparent;border:1px dashed var(--muted)}
.gridbtn{width:52px;height:44px;margin-right:8px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}

.lst{padding:0 12px calc(112px + var(--sb))}
.gh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;padding:16px 12px 8px;font-size:13px;color:var(--sub)}
.rows{background:var(--card);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:76px;padding:0 12px 0 20px;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row+.row::before{content:"";position:absolute;left:20px;right:0;top:0;border-top:1px solid var(--line)}
.row.picked{background:var(--selbg)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px 0;text-align:left;-webkit-touch-callout:none}
.row .tx{min-width:0;display:block}
.row .t{display:block;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:flex;gap:12px;font-size:14px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden}
.row .s b{color:var(--ink);font-weight:500}
.chk{flex:none;width:26px;height:26px;border-radius:13px;border:2px solid var(--disabled);background:var(--card);display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ink);border:0}
.call{flex:none;width:52px;height:52px;border-radius:26px;background:var(--greenbg);color:var(--green);display:flex;align-items:center;justify-content:center}
.call.off{background:var(--line);color:var(--muted);pointer-events:none}
.empty{text-align:center;color:var(--sub);font-size:15px;line-height:1.75;padding:48px 24px}
.hint{text-align:center;color:var(--hint);font-size:13px;padding-top:20px}

.fab{position:fixed;right:20px;bottom:calc(24px + var(--sb));width:60px;height:60px;border-radius:30px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(27,36,32,.25)}
.actbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;gap:10px;padding:12px 16px calc(16px + var(--sb));border-top:1px solid var(--line)}
.actbar button{flex:1;height:52px;border-radius:18px;font-size:16px}
.actbar .mv{border:1px solid var(--border)}
.actbar .del{background:var(--redbg);color:var(--red);font-weight:700}
.actbar button:disabled{color:var(--muted);background:var(--line);border-color:var(--line)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:18px;font-size:17px;font-weight:700;background:var(--ink);color:#fff;text-decoration:none}
.btn.green{background:var(--green)}
.btn:disabled{background:var(--disabled)}
.btn2{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:18px;font-size:16px;background:var(--card);border:1px solid var(--border)}
.btn2:disabled{color:var(--muted)}
.foot{padding:12px 16px calc(20px + var(--sb));display:flex;flex-direction:column;gap:10px}

.dtitle{font-size:36px;line-height:1.2;font-weight:900;margin:0 8px 10px;word-break:break-all}
.pill{display:inline-block;font-size:14px;background:var(--card);border-radius:14px;padding:4px 12px;margin:0 8px 20px}
.kv{display:flex;align-items:center;gap:16px;min-height:56px;padding:10px 20px}
.kv+.kv{border-top:1px solid var(--line)}
.kv .k{color:var(--sub);font-size:15px}
.kv .v{flex:1;text-align:right;font-size:17px;font-weight:500;word-break:break-all}

.form{display:flex;flex-direction:column;gap:18px;padding:8px 16px 24px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{font-size:14px;color:var(--sub);padding-left:4px}
.fld input{height:52px;border-radius:14px;border:1px solid var(--border);background:var(--card);padding:0 16px;font-size:17px;color:var(--ink);outline:0;width:100%;-webkit-appearance:none;appearance:none}
.fld input:focus{border-color:var(--ink)}
.fld.err input{border:2px solid var(--red)}
.fld .e{font-size:14px;color:var(--red);padding-left:4px;display:none}
.fld.err .e{display:block}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--hint);padding-left:4px}
.newcat{display:flex;gap:8px;align-items:flex-end}
.newcat .fld{flex:1}
.newcat .btn{width:88px;height:52px;border-radius:14px}
.delbtn{height:52px;color:var(--red);font-size:16px;margin-top:24px;width:100%}

.seg{display:flex;gap:4px;margin:0 16px;height:48px;padding:4px;background:var(--card);border-radius:16px}
.seg button{flex:1;border-radius:12px;font-size:16px}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.catrow{display:flex;align-items:center;min-height:60px;padding:0 4px 0 20px}
.catrow+.catrow{border-top:1px solid var(--line)}
.catrow .nm{flex:1;min-width:0;padding:8px 0}
.catrow .nm b{display:block;font-size:17px;font-weight:500}
.catrow .nm span{font-size:13px;color:var(--sub)}
.catrow .iconbtn{width:44px;height:44px;color:var(--ink)}
.catrow .iconbtn:disabled{color:var(--line)}
.catrow .iconbtn.r{color:var(--red)}
.box{background:var(--card);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.box p{margin:0;font-size:15px;line-height:1.6}
.box .em{font-weight:700;line-height:1.75}
.box .sm{font-size:14px;color:var(--sub)}
.exrow{display:flex;align-items:center;padding:8px 8px 8px 20px}
.exrow+.exrow{border-top:1px solid var(--line)}
.exrow .nm{flex:1}
.exrow .nm b{display:block;font-weight:500}
.exrow .nm span{font-size:13px;color:var(--sub)}

.maprow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px 8px 20px}
.maprow+.maprow{border-top:1px solid var(--line)}
.maprow>span:first-child{flex:none;width:76px;font-size:15px}
.maprow i{display:block;font-style:normal;font-size:12px;color:var(--hint)}
select{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.fld select{flex:none;width:100%}
.chkrow.maprow{gap:12px}
/* 弹层 */
.ov{position:fixed;inset:0;z-index:20;background:rgba(27,36,32,.45);display:flex;flex-direction:column;justify-content:flex-end;animation:fade .15s ease}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(28px + var(--sb));max-height:80%;display:flex;flex-direction:column;animation:up .2s ease}
.sheet .grip{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--border);margin-bottom:12px}
.sheet h3{margin:0 4px 14px;font-size:18px}
.sheet .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;overflow-y:auto}
.cell{min-height:60px;border-radius:16px;background:var(--bg);display:flex;align-items:center;gap:8px;padding:8px 16px;text-align:left;font-size:16px}
.cell span:first-child{flex:1}
.cell .c{color:var(--hint)}
.cell.on{background:var(--ink);color:#fff;font-weight:700}
.cell.on .c{color:rgba(255,255,255,.7)}
.ovc{justify-content:center;padding:0 28px}
.dlg{background:var(--card);border-radius:22px;padding:24px 20px 12px;animation:fade .15s ease}
.dlg h3{margin:0 0 8px;font-size:18px;line-height:1.5}
.dlg p{margin:0;color:var(--sub);font-size:15px;line-height:1.6;white-space:pre-line}
.dlg .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:16px}
.dlg .acts button{height:44px;padding:0 14px;font-size:16px}
.dlg .acts .ok{font-weight:700}
.dlg .acts .danger{color:var(--red);font-weight:700}
.dlg .acts button:disabled{color:var(--muted)}
.dlg .fld{margin-top:12px}
.chkrow{display:flex;align-items:center;gap:12px;min-height:48px;font-size:16px;width:100%;text-align:left}
.chkrow:disabled{color:var(--muted)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}

#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(110px + var(--sb));z-index:40;background:var(--ink);color:#fff;font-size:15px;padding:12px 20px;border-radius:22px;max-width:calc(100% - 40px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ========= 数据：与安卓版相同的结构，备份文件互通 ========= */
const KINDS = {
  EMP: { noun: '员工', unit: '人', item: '员工' },
  VEH: { noun: '设备与车辆', unit: '台', item: '设备/车辆' }
};
const ALL = '全部', UNCAT = '未分类';
const KEY = 'staff-contacts-v1';
const D = { recs: [], EMP: [], VEH: [] };   // 记录 + 两类分类表

const norm = s => String(s || '').toLowerCase().replace(/[\s\-_]/g, '');
const fmtPhone = p => /^\d+$/.test(p || '') ? p.replace(/(\d{3})(?=\d)/g, '$1 ') : (p || '');
function cleanPhone(p) {
  let s = String(p || '').trim().replace(/[\s\-]/g, '');
  if (s.endsWith('.0')) s = s.slice(0, -2);
  if (s.startsWith('+245')) s = s.slice(4); else if (s.startsWith('00245')) s = s.slice(5);
  return s;
}
const cleanCode = c => String(c || '').trim().replace(/\s+/g, '').toUpperCase();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const title = r => r.kind === 'EMP' ? r.name : r.code;
const searchText = r => r.kind === 'EMP' ? `${r.code} ${r.name} ${r.phone}` : `${r.code} ${r.cat} ${r.note}`;
const of = k => D.recs.filter(r => r.kind === k);
const catOf = r => (r.cat && D[r.kind].includes(r.cat)) ? r.cat : UNCAT;
const get = id => D.recs.find(r => r.id === id);
const findByCode = (k, code, except) => { const n = norm(code); return n ? D.recs.find(r => r.kind === k && r.id !== except && norm(r.code) === n) : null; };

function toJson(emp = true, veh = true) {
  return {
    app: 'staff-vehicle', version: 1, savedAt: Date.now(),
    empCats: emp ? D.EMP.slice() : [], vehCats: veh ? D.VEH.slice() : [],
    records: D.recs.filter(r => (r.kind === 'EMP' ? emp : veh)).map(r => ({ id: r.id, kind: r.kind, code: r.code, name: r.name, phone: r.phone, note: r.note, cat: r.cat }))
  };
}
function parseSnap(o) {
  const strs = a => { const out = []; (Array.isArray(a) ? a : []).forEach(x => { const s = String(x || '').trim(); if (s && !out.includes(s)) out.push(s); }); return out; };
  const recs = (Array.isArray(o.records) ? o.records : []).filter(j => j && (j.kind === 'EMP' || j.kind === 'VEH') && String(j.code || '').trim())
    .map(j => ({ id: j.id || uid(), kind: j.kind, code: String(j.code), name: String(j.name || ''), phone: String(j.phone || ''), note: String(j.note || ''), cat: String(j.cat || '') }));
  return { recs, EMP: strs(o.empCats), VEH: strs(o.vehCats) };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = parseSnap(JSON.parse(raw)); D.recs = s.recs; D.EMP = s.EMP; D.VEH = s.VEH; }
  } catch (e) { console.warn('load failed', e); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(toJson())); }
  catch (e) { toast('保存失败：手机存储空间不足或浏览器禁止保存'); }
}
const addCatSilently = (k, n) => { n = String(n || '').trim(); if (n && n !== ALL && n !== UNCAT && !D[k].includes(n)) D[k].push(n); };
function validCat(k, name, except) {
  const n = String(name || '').trim();
  if (!n) return '请输入分类名称';
  if (n === ALL || n === UNCAT) return `「${n}」是保留名称，请换一个`;
  if (n !== except && D[k].includes(n)) return `已经有「${n}」这个分类了`;
  return null;
}
function upsert(r) { const i = D.recs.findIndex(x => x.id === r.id); if (i >= 0) D.recs[i] = r; else D.recs.push(r); addCatSilently(r.kind, r.cat); save(); }
function delRecs(ids) { D.recs = D.recs.filter(r => !ids.has(r.id)); save(); }
function moveRecs(ids, cat) { const c = cat === UNCAT ? '' : cat; D.recs.forEach(r => { if (ids.has(r.id)) r.cat = c; }); save(); }
function renameCat(k, old, nw) { nw = nw.trim(); const i = D[k].indexOf(old); if (i < 0) return; D[k][i] = nw; D.recs.forEach(r => { if (r.kind === k && r.cat === old) r.cat = nw; }); save(); }
function deleteCat(k, name) { D[k] = D[k].filter(c => c !== name); D.recs.forEach(r => { if (r.kind === k && r.cat === name) r.cat = ''; }); save(); }
function moveCat(k, i, d) { const l = D[k], j = i + d; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; save(); }
function merge(k, incoming, cats, replace) {
  let added = 0, updated = 0;
  if (replace) { D.recs = D.recs.filter(r => r.kind !== k); D[k] = []; }
  cats.forEach(c => addCatSilently(k, c));
  incoming.filter(r => r.kind === k).forEach(r => {
    const ex = findByCode(k, r.code);
    if (ex) { Object.assign(ex, r, { id: ex.id }); updated++; } else { D.recs.push(Object.assign({}, r, { id: uid() })); added++; }
    addCatSilently(k, r.cat);
  });
  save();
  return [added, updated];
}

/* ========= CSV（WPS / Excel 另存为 CSV） ========= */
function decodeBytes(buf) {
  let b = new Uint8Array(buf);
  if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) b = b.subarray(3);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(b); }
  catch (e) { try { return new TextDecoder('gbk').decode(b); } catch (e2) { return new TextDecoder('utf-8').decode(b); } }
}
function parseCsv(text) {
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const sep = (!first.includes(',') && first.includes('\t')) ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\r') { }
    else if (ch === '\n') { row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
const csvEsc = s => /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
function sortedForExport(k) {
  const order = D[k];
  return of(k).sort((a, b) => {
    const ca = catOf(a), cb = catOf(b);
    const ia = ca === UNCAT ? 1e9 : order.indexOf(ca), ib = cb === UNCAT ? 1e9 : order.indexOf(cb);
    return ia - ib || norm(a.code).localeCompare(norm(b.code));
  });
}
function exportCsv(k) {
  let s = '﻿';
  if (k === 'EMP') { s += '工票号,名字,手机号,分类\r\n'; sortedForExport(k).forEach(r => { s += [r.code, r.name, r.phone, catOf(r)].map(csvEsc).join(',') + '\r\n'; }); }
  else { s += '编号,分类,备注\r\n'; sortedForExport(k).forEach(r => { s += [r.code, catOf(r), r.note].map(csvEsc).join(',') + '\r\n'; }); }
  return s;
}

/* ========= 读取 xlsx（用浏览器自带的解压，不需要第三方库） ========= */
async function unzip(buf) {
  const dv = new DataView(buf), td = new TextDecoder();
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new Error('不是有效的 xlsx 文件');
  const n = dv.getUint16(eocd + 10, true); let off = dv.getUint32(eocd + 16, true);
  const ents = {};
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true), elen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    ents[td.decode(new Uint8Array(buf, off + 46, nlen))] = { method, csize, lho };
    off += 46 + nlen + elen + clen;
  }
  return async name => {
    const e = ents[name]; if (!e) return null;
    const nl = dv.getUint16(e.lho + 26, true), el = dv.getUint16(e.lho + 28, true);
    const data = new Uint8Array(buf, e.lho + 30 + nl + el, e.csize);
    if (e.method === 0) return td.decode(data);
    if (e.method !== 8) throw new Error('不支持的压缩方式');
    if (typeof DecompressionStream === 'undefined') throw new Error('手机系统版本太旧，读不了 xlsx，请升级系统，或把表格另存为 CSV 再导入');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return td.decode(await new Response(stream).arrayBuffer());
  };
}
const colIndex = ref => { let n = 0; for (const ch of ref) { const c = ch.charCodeAt(0); if (c < 65 || c > 90) break; n = n * 26 + c - 64; } return n - 1; };
async function openXlsx(buf) {
  const read = await unzip(buf);
  const P = x => new DOMParser().parseFromString(x, 'application/xml');
  const wb = P(await read('xl/workbook.xml')), rels = P(await read('xl/_rels/workbook.xml.rels') || '<r/>');
  const target = {};
  for (const r of rels.getElementsByTagName('Relationship')) target[r.getAttribute('Id')] = r.getAttribute('Target');
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const sheets = [...wb.getElementsByTagName('sheet')].map(el => {
    const t = target[el.getAttributeNS(RNS, 'id') || el.getAttribute('r:id')] || '';
    return { name: el.getAttribute('name'), path: t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '') };
  });
  let shared = null;
  const sst = async () => {
    if (shared) return shared;
    shared = [];
    const x = await read('xl/sharedStrings.xml');
    if (x) for (const si of P(x).getElementsByTagName('si')) {
      let v = ''; for (const t of si.getElementsByTagName('t')) { const pn = t.parentNode.localName; if (pn === 'si' || pn === 'r') v += t.textContent; }
      shared.push(v);

  };
  return {
    names: sheets.map(x => x.name),
    async rows(name) {
      const sh = sheets.find(x => x.name === name); if (!sh) return [];
      const ss = await sst(), doc = P(await read(sh.path) || '<r/>'), out = [];
      for (const row of doc.getElementsByTagName('row')) {
        const ri = (+row.getAttribute('r') || out.length + 1) - 1, arr = [];
        let ci = -1;
        for (const c of row.getElementsByTagName('c')) {
          const ref = c.getAttribute('r'); ci = ref ? colIndex(ref) : ci + 1;
          const t = c.getAttribute('t'), ve = c.getElementsByTagName('v')[0];
          let v = '';
          if (t === 's') v = ve ? (ss[+ve.textContent] || '') : '';
          else if (t === 'inlineStr') v = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
          else if (ve) { v = ve.textContent; if (t !== 'str' && /^-?\d+(\.\d+)?(e[+-]?\d+)?$/i.test(v)) { const num = Number(v); if (Number.isInteger(num)) v = String(num); } }
          v = v.trim(); if (v) arr[ci] = v;
        }
        out[ri] = arr;
      }
      for (let i = 0; i < out.length; i++) if (!out[i]) out[i] = [];

    }
  };
}

/* ========= 导入：自动找表头和对应的列，先预览再导入 ========= */
const FIELDS = {
  EMP: [
    { key: 'code', label: '工票号', need: true, kw: ['工票号', '工号', '工票', '编号'], ex: ['档案', '身份证', '证件'] },
    { key: 'name', label: '名字', need: true, kw: ['姓名', '名字', '名称'], ex: ['领工', '工长', '联系人', '中方', '负责人'] },

    { key: 'cat', label: '分类', kw: ['分类', '类别', '工种'], ex: [], none: '不导入分类' },
    { key: 'status', label: '在岗状态', kw: ['状态', '在岗'], ex: [], none: '不筛选' }
  ],

    { key: 'cat', label: '分类', kw: ['分类', '类别', '车型', '类型'], ex: [], none: '不导入分类' },
    { key: 'note', label: '备注', kw: ['备注', '营地', '位置', '所在'], ex: [], none: '不导入' },
    { key: 'status', label: '状态', kw: ['状态'], ex: [], none: '不筛选' }
  ]
};
function colScore(h, f) {
  h = String(h || '').replace(/\s/g, ''); if (!h || f.ex.some(e => h.includes(e))) return 0;
  let best = 0;
  f.kw.forEach((w, i) => { if (h === w) best = Math.max(best, 100 - i); else if (h.includes(w)) best = Math.max(best, 50 - i); });
  return best;
}
function bestCol(head, f) {
  let bi = -1, bs = 0;
  head.forEach((h, i) => { const sc = colScore(h, f); if (sc > bs) { bs = sc; bi = i; } });
  return bi;
}
function guessLayout(k, rows) {
  const F = FIELDS[k];

    const n = F.filter(f => bestCol(head, f) >= 0).length;
    if (n > best) { best = n; hdr = i; }
  }
  if (best < (k === 'EMP' ? 2 : 1)) hdr = -1;
  const map = {};
  F.forEach((f, i) => { map[f.key] = hdr >= 0 ? bestCol(rows[hdr], f) : (i < (k === 'EMP' ? 4 : 3) ? i : -1); });

}
const isActive = s => /在岗|在职/.test(s) && !/非|不|离|停/.test(s);
function importPhone(v) {

  let s = raw.split(/[\/,，;；、]/)[0].replace(/[\s\-.()（）]/g, '').replace(/^(\+|00)245/, '');

  const k = st.k, m = st.map, rows = st.rows;
  const g = (r, i) => i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : '';
  const recs = []; let skipped = 0, filtered = 0;
  rows.slice(st.hdr + 1).forEach(r => {
    if (!r || !r.some(x => x)) return;
    if (m.status >= 0 && st.onlyActive && !isActive(g(r, m.status))) { filtered++; return; }
    const code = cleanCode(g(r, m.code)), name = g(r, m.name);
    if (!code || (k === 'EMP' && !name)) { skipped++; return; }
    let cat = g(r, m.cat); if (cat === UNCAT) cat = '';

async function shareFile(name, text, mime) {

function editCheck(t) {

function doSave(keep) {

function showRestore(snap) {
  const nE = snap.recs.filter(r => r.kind === 'EMP').length, nV = snap.recs.filter(r => r.kind === 'VEH').length;
  const sel = { EMP: nE > 0, VEH: nV > 0 };

    const any = sel.EMP || sel.VEH;
    const cr = (k, label, n) => `<button class="chkrow" data-k="${k}" ${n ? '' : 'disabled'}><span class="chk ${sel[k] ? 'on' : ''}">${sel[k] ? I.check : ''}</span><span class="num">${label}（${n} ${KINDS[k].unit}）</span></button>`;

      <div class="acts"><button data-act="closeLayer">取消</button><button class="danger" id="rsRep" ${any ? '' : 'disabled'}>替换</button><button class="ok" id="rsMerge" ${any ? '' : 'disabled'}>合并</button></div></div></div>`;
    layer.querySelectorAll('.chkrow').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); sel[b.dataset.k] = !sel[b.dataset.k]; draw(); }));
    const run = replace => {

    };
  };

}

    const t = top_(), k = t.k, ui = lists[k], all = of(k);
    showSheet('移到哪个分类', D[k].concat(UNCAT).map(c => ({ label: c, value: c, on: false, n: all.filter(r => catOf(r) === c).length })), c => {
      const n = ui.picked.size; moveRecs(ui.picked, c); ui.sel = false; ui.picked.clear(); updateList();
      toast(`已把 ${n} ${KINDS[k].unit}移到 ${c}`);
    });
  },
  askDelPicked: () => {
    const t = top_(), k = t.k, ui = lists[k];
    const names = of(k).filter(r => ui.picked.has(r.id)).map(title);
    showConfirm(names.length === 1 ? `删除 ${names[0]}？` : `删除选中的 ${names.length} ${KINDS[k].unit}？`, '删除后不能恢复。', '删除', () => {
      const n = ui.picked.size; delRecs(ui.picked); ui.sel = false; ui.picked.clear(); updateList(); toast(`已删除 ${n} ${KINDS[k].unit}`);
    });
  },
  add: () => push({ s: 'edit', k: top_().k, id: null }),
  edit: b => push({ s: 'edit', k: top_().k, id: b.dataset.id }),
  formCat: b => { const t = top_(); t.form.cat = t.form.cat === b.dataset.c ? '' : b.dataset.c; renderEdit(t); },
  toggleNewCat: () => { const t = top_(); t.newCatOpen = !t.newCatOpen; renderEdit(t); if (t.newCatOpen) document.getElementById('newCat').focus(); },
  addNewCat: () => {
    const t = top_(), n = t.newCat.trim();
    if (validCat(t.k, n)) return;
    addCatSilently(t.k, n); save(); t.form.cat = n; t.newCat = ''; t.newCatOpen = false; renderEdit(t);
  },
  save: b => doSave(!!b.dataset.keep),
  askDelOne: () => {
    const t = top_(), r = get(t.id);
    showConfirm(r.kind === 'EMP' ? `删除 ${r.name}（${r.code}）？` : `删除 ${r.code}？`, '删除后不能恢复。', '删除', () => {
      delRecs(new Set([r.id])); toast(`已删除 ${title(r)}`);
      let n = 0; for (let i = stack.length - 1; i > 0 && stack[i].s !== 'list'; i--) n++;
      back(n);
    });
  },
  catKind: b => { top_().k = b.dataset.k; render(); },
  catMove: b => { const t = top_(); moveCat(t.k, +b.dataset.i, +b.dataset.d); render(); },
  catRename: b => { const t = top_(), old = D[t.k][+b.dataset.i]; showName('修改分类名称', old, v => validCat(t.k, v, old), v => { renameCat(t.k, old, v); render(); }); },
  catDelete: b => {
    const t = top_(), K = KINDS[t.k], c = D[t.k][+b.dataset.i], n = D.recs.filter(r => r.kind === t.k && r.cat === c).length;
    showConfirm(`删除分类「${c}」？`, n ? `这个分类下的 ${n} ${K.unit}不会被删除，会变成「未分类」。` : `这个分类下没有${K.item}。`, '删除分类', () => { deleteCat(t.k, c); render(); });
  },
  catAdd: () => { const t = top_(); showName(`新建${KINDS[t.k].noun}分类`, '', v => validCat(t.k, v), v => { addCatSilently(t.k, v); save(); render(); }); },
  csvImport: b => { const k = b.dataset.k; pickFile((buf, name) => startImport(k, buf, name)); },
  toggleActive: () => { const t = top_(); t.onlyActive = !t.onlyActive; renderImp(t); },
  doImport: () => {
    const t = top_(), K = KINDS[t.k], res = buildImport(t);
    const [a, u] = merge(t.k, res.list, [], false);
    back();
    setTimeout(() => showInfo('导入完成', `新增 ${a} ${K.unit}，更新 ${u} ${K.unit}。`), 50);
  },
  csvShare: b => shareFile(csvName(b.dataset.k), exportCsv(b.dataset.k), 'text/csv'),
  csvSave: b => downloadFile(csvName(b.dataset.k), exportCsv(b.dataset.k), 'text/csv'),
  bakShare: () => shareFile(backupName(), JSON.stringify(toJson(), null, 2), 'application/json'),
  bakSave: () => downloadFile(backupName(), JSON.stringify(toJson(), null, 2), 'application/json'),
  bakRestore: () => pickFile(buf => {
    try {
      const o = JSON.parse(decodeBytes(buf));
      if (!o || o.app !== 'staff-vehicle') throw 0;
      showRestore(parseSnap(o));
    } catch (e) { showInfo('打不开这个文件', '这不是员工联系方式的备份文件，或者文件已损坏。'); }
  })
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.disabled) return;
  const f = A[b.dataset.act]; if (f) f(b, e);
});

/* ========= 启动 ========= */
load();
history.replaceState({ d: 1 }, '');
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
